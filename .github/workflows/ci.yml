name: MemoryVault CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  unit-and-integration:
    name: Unit & Integration Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm run test

      - name: Verify Next.js Production Build
        run: npm run build

  e2e-and-visual-qa:
    name: End-to-End & Responsive Visual QA (Playwright)
    runs-on: ubuntu-latest
    needs: unit-and-integration

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Application
        run: npm run build

      - name: Run Playwright E2E Tests (Desktop & Android-Class Viewports)
        run: npm run test:e2e

      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
